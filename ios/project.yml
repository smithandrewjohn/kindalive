# XcodeGen spec — regeneration fallback for Kindalive.xcodeproj.
#
# The committed project.pbxproj was authored by hand (this repo is
# developed without Xcode available). If Xcode ever refuses to open it,
# rebuild an equivalent project with:
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# and open the regenerated Kindalive.xcodeproj.

name: Kindalive
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  KindaliveKit:
    path: KindaliveKit

targets:
  Kindalive:
    type: application
    platform: iOS
    sources:
      - KindaliveApp
    dependencies:
      - package: KindaliveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kindalive.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
